[package]
name = "badgeuse"
version = "0.1.0"
description = "Émargement des étudiants par carte NFC"
edition = "2024"

[lib]
name = "badgeuse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
badgeuse-core = { path = "../crates/badgeuse-core", features = ["pcsc", "usb"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.6"
tauri-plugin-dialog = "2.8.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
tauri-build = "2.7.5"
