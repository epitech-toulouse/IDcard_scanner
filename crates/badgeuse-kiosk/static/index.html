<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badgeuse</title>
<style>
  :root {
    --bg: #0f1722;
    --fg: #f2f5f9;
    --muted: #93a1b5;
    --ok: #1f9d55;
    --warn: #d98200;
    --error: #d13b3b;
    --silent: #2f7fb8;
    --idle: #1a2536;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr;
    overflow: hidden;
    cursor: none;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    padding: 1.2rem 2rem;
    font-size: clamp(1rem, 2.2vw, 1.7rem);
  }
  #session { font-weight: 600; }
  .pill {
    padding: 0.3em 0.9em;
    border-radius: 999px;
    background: var(--idle);
    color: var(--muted);
    white-space: nowrap;
  }
  .pill.ok { color: #8be0ae; }
  .pill.offline { background: #3b2a10; color: #ffc46b; }
  .pill.refused { background: #3d1717; color: #ff9b9b; }
  main {
    display: grid;
    place-items: center;
    padding: 1rem 2rem 2rem;
    transition: background 0.2s;
  }
  main.ok { background: var(--ok); }
  main.silent { background: var(--silent); }
  main.warn { background: var(--warn); }
  main.error { background: var(--error); }
  .panel { text-align: center; max-width: 90vw; }
  #idle .clock { font-size: clamp(4rem, 16vw, 12rem); font-weight: 200; letter-spacing: 0.02em; line-height: 1; }
  #idle .hint { margin-top: 1.5rem; font-size: clamp(1.4rem, 3.6vw, 3rem); color: var(--muted); }
  #result .icon {
    width: clamp(5rem, 14vw, 10rem);
    height: clamp(5rem, 14vw, 10rem);
    margin: 0 auto 1.5rem;
    border-radius: 50%;
    border: 0.4rem solid currentColor;
    display: grid;
    place-items: center;
    font-size: clamp(3rem, 9vw, 7rem);
    line-height: 1;
  }
  #result .name { font-size: clamp(2.6rem, 9vw, 7rem); font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
  #result .label { margin-top: 0.8rem; font-size: clamp(2rem, 6vw, 4.5rem); font-weight: 600; }
  #result .message { margin-top: 0.8rem; font-size: clamp(1.3rem, 3.4vw, 2.6rem); opacity: 0.92; }
  #result.pop .panel { animation: pop 0.25s ease-out; }
  @keyframes pop { from { transform: scale(0.94); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  #noapp {
    position: fixed; inset: auto 0 0 0; padding: 0.8rem; text-align: center;
    background: var(--error); font-size: 1.3rem;
  }
  #mock { position: fixed; left: 1rem; bottom: 1rem; display: flex; gap: 0.5rem; cursor: auto; }
  #mock input, #mock button { font: inherit; padding: 0.4rem 0.7rem; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #result.pop .panel { animation: none; } }
</style>
</head>
<body>
<header>
  <span id="session">Aucun créneau ouvert</span>
  <span>
    <span id="reader" class="pill offline" hidden>Lecteur NFC non détecté</span>
    <span id="network" class="pill">Connexion…</span>
  </span>
</header>

<main id="stage">
  <div id="idle" class="panel">
    <div class="clock" id="clock">--:--</div>
    <div class="hint">Passez votre carte étudiante sur le lecteur</div>
  </div>
  <div id="result" class="panel" hidden role="status" aria-live="assertive">
    <div class="icon" id="icon"></div>
    <div class="name" id="name"></div>
    <div class="label" id="label"></div>
    <div class="message" id="message"></div>
  </div>
</main>

<div id="noapp" hidden>La borne ne répond plus : redémarrage en cours…</div>
<form id="mock" hidden>
  <input id="mockuid" placeholder="UID (ex. 04:24:A5:82)" autocomplete="off">
  <button>Badger</button>
</form>

<script>
  const $ = (id) => document.getElementById(id);
  const ICON = { ok: "✓", silent: "✓", warn: "!", error: "✕" };
  const STATUS = { present: "Présent", late: "En retard" };
  let lastSeq = 0;

  const fmt = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" });
  let shownClock = "";
  function clock() {
    const t = fmt.format(new Date());
    if (t !== shownClock) { // l'affichage ne change qu'une fois par minute : pas de réécriture du DOM
      shownClock = t;
      $("clock").textContent = t;
    }
  }

  function network(s) {
    const el = $("network");
    el.className = "pill";
    if (s.network === "ok") {
      el.classList.add("ok");
      el.textContent = "En ligne";
    } else if (s.network === "refused") {
      el.classList.add("refused");
      el.textContent = "Jeton refusé : vérifier la configuration";
    } else if (s.network === "offline") {
      el.classList.add("offline");
      el.textContent = "Hors ligne" + (s.pending ? ` · ${s.pending} badge(s) en attente` : "");
    } else {
      el.textContent = "Connexion…";
    }
  }

  function render(s) {
    $("session").textContent = s.session ?? "Aucun créneau ouvert";
    $("reader").hidden = s.readers > 0;
    network(s);

    const stage = $("stage");
    stage.className = "";
    if (!s.last) {
      $("idle").hidden = false;
      $("result").hidden = true;
      return;
    }
    const fb = s.last.feedback;
    stage.classList.add(fb);
    $("idle").hidden = true;
    $("result").hidden = false;
    $("icon").textContent = ICON[fb] ?? "";
    $("name").textContent = s.last.name ?? "";
    $("label").textContent = STATUS[s.last.status] ?? "";
    $("message").textContent = s.last.message;
    if (s.last.seq !== lastSeq) {
      lastSeq = s.last.seq;
      $("result").classList.remove("pop");
      void $("result").offsetWidth; // relance l'animation pour chaque nouveau badge
      $("result").classList.add("pop");
    }
  }

  let lastRaw = "";
  let down = false;
  async function tick() {
    try {
      const r = await fetch("/state", { cache: "no-store" });
      const raw = await r.text();
      if (raw !== lastRaw) { // rien n'a changé : on ne touche pas au DOM (le Pi n'a pas à repeindre)
        lastRaw = raw;
        render(JSON.parse(raw));
      }
      if (down) { down = false; $("noapp").hidden = true; }
    } catch {
      if (!down) { down = true; $("noapp").hidden = false; }
    }
  }

  fetch("/mock").then((r) => { $("mock").hidden = !r.ok; }).catch(() => {});
  $("mock").addEventListener("submit", (e) => {
    e.preventDefault();
    const uid = $("mockuid").value.trim();
    if (uid) fetch("/inject", { method: "POST", body: uid });
  });

  clock();
  setInterval(clock, 5000);
  tick();
  setInterval(tick, 500);
</script>
</body>
</html>
